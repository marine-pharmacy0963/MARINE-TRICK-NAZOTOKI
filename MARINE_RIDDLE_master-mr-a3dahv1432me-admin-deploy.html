<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🧩 MARINE RIDDLE MASTER</title><style>
*{box-sizing:border-box} :root{--a:#1686c9;--a2:#0878bd;--line:#9bd6f4;--panel:rgba(255,255,255,.94);--soft:#eef9ff}
body{margin:0;min-height:100vh;background:#eaf7ff center/cover fixed no-repeat;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#123}
body:before{content:"";position:fixed;inset:0;background:rgba(234,247,255,.35);z-index:-1}
main{max-width:1080px;margin:auto;padding:14px}h1{color:var(--a2)}h2{margin-top:4px}
.box,.item{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;margin:11px 0;backdrop-filter:blur(5px)}
.item{border-width:1px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
input,textarea,select{width:100%;padding:9px;margin:4px 0;border:1px solid var(--line);border-radius:8px;background:white}textarea{min-height:72px;resize:vertical}
button,.filebtn{display:inline-block;border:0;border-radius:9px;padding:9px 11px;margin:3px;background:var(--a);color:white;font-weight:800;cursor:pointer}
button:active,.filebtn:active{transform:translateY(1px)}.danger{background:#b94b4b}.secondary{background:#607d8b}.good{background:#278a62}
.small{font-size:11px;color:#567;line-height:1.6}.status{font-size:12px;font-weight:800;color:#176a4d}.top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.top b{flex:1}
.thumb{width:90px;height:90px;object-fit:contain;background:var(--soft);border-radius:12px}.hidden{display:none!important}
#lock{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#dff4ff,#8bd2f5);display:flex;align-items:center;justify-content:center;padding:20px}
#lock>div{width:min(430px,100%);background:#fff;border:2px solid #79c8ef;border-radius:22px;padding:22px;box-shadow:0 18px 55px #1678a533}
details{border-top:1px solid #def;padding-top:8px;margin-top:8px}summary{cursor:pointer;font-weight:800}
</style></head><body>
<div id="lock"><div><h2>🔐 🧩 MARINE RIDDLE MASTER</h2><div class="small">管理パスワードを入力してください。</div><input id="pw" type="password" inputmode="numeric"><button id="loginBtn">管理画面を開く</button><div id="loginMsg" class="small"></div></div></div>
<main id="app" class="hidden"><h1>🧩 MARINE RIDDLE MASTER</h1><div class="small">単発・連動型の追加、改編、並び替え、画像差し替え対応 <span id="status" class="status"></span></div>
<div class="box"><h2>🌊 ホーム背景同期</h2><div class="small">同じ場所の marine-theme.json を自動読込。必要なら手動でも読み込めます。</div><label class="filebtn">marine-theme.json を選択<input id="themeFile" type="file" accept=".json" hidden></label><div id="themeMsg" class="small"></div></div>

<div class="box"><h2>💾 保存・バックアップ</h2><button id="saveNow" class="good">今すぐ保存</button><button id="backup">MASTERバックアップ</button><label class="filebtn">バックアップ読込<input id="restore" type="file" accept=".json" hidden></label></div>
<div class="box"><h2>🧩 謎解きセット</h2><div class="small">単発も、5問連動のようなストーリー型も作れます。セット内の問題数は自由。</div><div id="sets"></div><button id="addSet">＋ 謎解きセット追加</button></div>
<div class="box"><h2>📦 実装用書き出し</h2><div class="small">公開用 index.html はセット選択、ヒント、答え判定、途中保存・再開に対応。</div><button id="export">riddle-data.json</button><button id="exportIndex" class="good">公開用 index.html を書き出す</button></div>
</main><script>const $=id=>document.getElementById(id);
const STORAGE="marine_riddle_master_v1",THEMEKEY="marine_theme_cache_v1";
let data={sets:[]},timer;function state(){return{schema:"marine-riddle-master-v1",updated:new Date().toISOString(),sets:data.sets}}
function save(show=false){try{localStorage.setItem(STORAGE,JSON.stringify(state()));if(show)$("status").textContent="保存しました ✓"}catch(e){alert("保存容量を超えた可能性があります")}}function autos(){clearTimeout(timer);timer=setTimeout(()=>save(),300)}
function load(){try{let x=JSON.parse(localStorage.getItem(STORAGE)||"null");if(x)data=x}catch(e){};render()}
function render(){$("sets").innerHTML="";data.sets.forEach((s,si)=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<div class="top"><b>${esc(s.title||"謎解きセット")}</b><button data-sup="${si}">↑</button><button data-sdown="${si}">↓</button><button class="danger" data-sdel="${si}">削除</button></div><label>セット名<input data-si="${si}" data-sk="title" value="${esc(s.title)}"></label><label>導入文<textarea data-si="${si}" data-sk="intro">${esc(s.intro)}</textarea></label><div id="p${si}"></div><button data-addp="${si}">＋ このセットに問題追加</button>`;$("sets").appendChild(d);let p=d.querySelector("#p"+si);s.puzzles.forEach((q,pi)=>{let x=document.createElement("details");x.open=true;x.innerHTML=`<summary>第${pi+1}問 ${esc(q.question||"未入力")}</summary><div class="top">${q.image?`<img class="thumb" src="${q.image}">`:""}<span></span><button data-pup="${si}:${pi}">↑</button><button data-pdown="${si}:${pi}">↓</button><button class="danger" data-pdel="${si}:${pi}">削除</button></div><label>問題文<textarea data-p="${si}:${pi}" data-pk="question">${esc(q.question)}</textarea></label><label>答え<input data-p="${si}:${pi}" data-pk="answer" value="${esc(q.answer)}"></label><label>ヒント<textarea data-p="${si}:${pi}" data-pk="hint">${esc(q.hint)}</textarea></label><label>解説・次への手がかり<textarea data-p="${si}:${pi}" data-pk="explanation">${esc(q.explanation)}</textarea></label><label>画像<input type="file" accept="image/*" data-pimg="${si}:${pi}"></label>`;p.appendChild(x)})})}
$("sets").oninput=e=>{if(e.target.dataset.si!==undefined){data.sets[+e.target.dataset.si][e.target.dataset.sk]=e.target.value;autos()}if(e.target.dataset.p){let[a,b]=e.target.dataset.p.split(":");data.sets[+a].puzzles[+b][e.target.dataset.pk]=e.target.value;autos()}}
$("sets").onchange=e=>{if(e.target.dataset.pimg){let[a,b]=e.target.dataset.pimg.split(":");readImg(e.target.files[0],s=>{data.sets[+a].puzzles[+b].image=s;render();save()})}}
$("sets").onclick=e=>{let z;if(e.target.dataset.addp!==undefined){data.sets[+e.target.dataset.addp].puzzles.push({id:uid("riddle"),question:"",answer:"",hint:"",explanation:"",image:""});render();autos()}if(e.target.dataset.sdel!==undefined&&confirm("セットごと削除しますか？")){data.sets.splice(+e.target.dataset.sdel,1);render();autos()}if(e.target.dataset.sup!==undefined){let i=+e.target.dataset.sup;if(i>0)[data.sets[i-1],data.sets[i]]=[data.sets[i],data.sets[i-1]];render();autos()}if(e.target.dataset.sdown!==undefined){let i=+e.target.dataset.sdown;if(i<data.sets.length-1)[data.sets[i+1],data.sets[i]]=[data.sets[i],data.sets[i+1]];render();autos()}for(let k of ["pup","pdown","pdel"])if(e.target.dataset[k]){let[a,b]=e.target.dataset[k].split(":").map(Number),p=data.sets[a].puzzles;if(k=="pup"&&b>0)[p[b-1],p[b]]=[p[b],p[b-1]];if(k=="pdown"&&b<p.length-1)[p[b+1],p[b]]=[p[b],p[b+1]];if(k=="pdel"&&confirm("この問題を削除しますか？"))p.splice(b,1);render();autos()}}}
$("addSet").onclick=()=>{data.sets.push({id:uid("set"),title:"新しい謎解き",intro:"",puzzles:[]});render();autos()};$("saveNow").onclick=()=>save(true);$("backup").onclick=()=>dl("marine-riddle-master-backup.json",JSON.stringify(state(),null,2));$("export").onclick=()=>dl("riddle-data.json",JSON.stringify(state(),null,2));$("restore").onchange=e=>{let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();load()}catch(_){alert("読込失敗")}};r.readAsText(e.target.files[0])}


function publicThemeScript(){
return `<script>
(function(){
 const THEMEKEY="marine_theme_cache_v1";
 function find(o){let st=[o],seen=new Set();while(st.length){let x=st.pop();if(!x||typeof x!=="object"||seen.has(x))continue;seen.add(x);for(let [k,v] of Object.entries(x)){if(typeof v==="string"&&/background|image|bg/i.test(k)&&(v.startsWith("data:image/")||v.startsWith("http")||v.startsWith("./")||v.startsWith("../")))return v;if(v&&typeof v==="object")st.push(v)}}return""}
 function apply(t){let im=find(t);if(im)document.body.style.backgroundImage='url("'+im.replace(/"/g,"%22")+'")'}
 fetch("marine-theme.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(t=>{try{localStorage.setItem(THEMEKEY,JSON.stringify(t))}catch(e){};apply(t)}).catch(()=>{try{let s=localStorage.getItem(THEMEKEY);if(s)apply(JSON.parse(s))}catch(e){}})
})();<\/script>`;
}
function publicCss(){
return `*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eaf7ff center/cover fixed no-repeat;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#123}body:before{content:"";position:fixed;inset:0;background:rgba(234,247,255,.42);z-index:-1}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:rgba(255,255,255,.94);border:2px solid #9bd6f4;border-radius:20px;padding:18px;margin:12px 0;backdrop-filter:blur(6px)}h1{color:#0878bd;margin-bottom:8px}button{border:0;border-radius:11px;padding:11px 14px;margin:5px;background:#1686c9;color:white;font-weight:800;cursor:pointer}.muted{color:#567;font-size:12px}.choice{display:block;width:100%;text-align:left}.good{background:#278a62}.bad{background:#b94b4b}.img{max-width:100%;max-height:300px;object-fit:contain;border-radius:14px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar>*{flex:1}.hidden{display:none!important}`;
}

function makeRiddleIndex(){
 const d=state(),payload=JSON.stringify(d).replace(/</g,"\\u003c");
 return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARINE RIDDLE</title><style>${publicCss()}</style></head><body><div class="wrap"><div class="card"><h1>MARINE RIDDLE</h1><div class="muted">謎解き</div></div><div id="game" class="card"></div><div class="card"><button id="home">セット選択</button><button id="reset">保存をリセット</button><span id="saved" class="muted"></span></div></div>${publicThemeScript()}<script>
const DATA=${payload},SAVE="marine_riddle_public_save_v1";const $=x=>document.getElementById(x),E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let st={set:-1,pos:0};
function load(){try{st=JSON.parse(localStorage.getItem(SAVE)||"null")||st}catch(e){}}
function save(){localStorage.setItem(SAVE,JSON.stringify(st));$("saved").textContent="進行状況を保存済み"}
function select(){st={set:-1,pos:0};$("game").innerHTML="<h2>謎解きを選ぶ</h2>"+DATA.sets.map((s,i)=>'<button class="choice" data-s="'+i+'">'+E(s.title)+'</button>').join("");document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{st={set:+b.dataset.s,pos:0};save();render()})}
function norm(x){return String(x??"").trim().toLowerCase().replace(/\s+/g,"")}
function render(){if(st.set<0||!DATA.sets[st.set])return select();let s=DATA.sets[st.set],q=s.puzzles[st.pos];if(!q){$("game").innerHTML="<h2>"+E(s.title)+" クリア！</h2><p>"+E(s.intro||"")+"</p>";save();return}
$("game").innerHTML="<h2>"+E(s.title)+"　第"+(st.pos+1)+"問</h2>"+(q.image?'<img class="img" src="'+q.image+'">':"")+"<p>"+E(q.question)+"</p><input id='ans' placeholder='答えを入力' style='width:100%;padding:11px;border:1px solid #9bd6f4;border-radius:10px'><button id='check'>答える</button><button id='hint'>ヒント</button><div id='fb'></div>";
$("hint").onclick=()=>$("fb").innerHTML="<p>"+E(q.hint||"ヒントはありません")+"</p>";$("check").onclick=()=>{if(norm($("ans").value)==norm(q.answer)){$("fb").innerHTML="<p><b>正解！</b></p><p>"+E(q.explanation||"")+"</p><button id='next'>次へ</button>";$("next").onclick=()=>{st.pos++;save();render()}}else $("fb").innerHTML="<p>もう一度考えてみよう。</p>"}}
$("home").onclick=select;$("reset").onclick=()=>{if(confirm("途中保存を消しますか？")){localStorage.removeItem(SAVE);select()}};load();render();
<\/script></body></html>`;
}
$("exportIndex").onclick=()=>dl("index.html",makeRiddleIndex(),"text/html;charset=utf-8");

const PW="3103";
function dl(n,t,type="application/json;charset=utf-8"){let b=new Blob([t],{type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7)}
function readImg(file,cb){if(!file)return;let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
function themeImage(o){let st=[o],seen=new Set();while(st.length){let x=st.pop();if(!x||typeof x!=="object"||seen.has(x))continue;seen.add(x);for(let [k,v] of Object.entries(x)){if(typeof v==="string"&&/background|image|bg/i.test(k)&&(v.startsWith("data:image/")||v.startsWith("http")||v.startsWith("./")||v.startsWith("../")))return v;if(v&&typeof v==="object")st.push(v)}}return""}
function applyTheme(t){let im=themeImage(t);if(im)document.body.style.backgroundImage=`url("${im.replace(/"/g,"%22")}")`;$("themeMsg").textContent=im?"ホーム背景を反映しました ✓":"背景画像が見つかりませんでした"}
async function autoTheme(){try{let r=await fetch("marine-theme.json",{cache:"no-store"});if(r.ok){let t=await r.json();localStorage.setItem(THEMEKEY,JSON.stringify(t));applyTheme(t);return}}catch(e){}try{let s=localStorage.getItem(THEMEKEY);if(s)applyTheme(JSON.parse(s))}catch(e){}}
$("themeFile").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let t=JSON.parse(r.result);localStorage.setItem(THEMEKEY,JSON.stringify(t));applyTheme(t)}catch(e){alert("marine-theme.jsonを読み込めませんでした")}};r.readAsText(f);e.target.value=""}
$("loginBtn").onclick=unlock;$("pw").onkeydown=e=>{if(e.key==="Enter")unlock()};
function unlock(){if($("pw").value===PW){$("lock").classList.add("hidden");$("app").classList.remove("hidden");sessionStorage.setItem(STORAGE+"_login","1");load();autoTheme()}else $("loginMsg").textContent="パスワードが違います"}
if(sessionStorage.getItem(STORAGE+"_login")==="1"){$("lock").classList.add("hidden");$("app").classList.remove("hidden");load();autoTheme()}
</script></body></html>
